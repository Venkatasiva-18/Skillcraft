        header {

        .login-container {

        .login-form {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 30, 0, 0.2);
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }
        .login-form h2 {
            color: #333;
            margin-bottom: 20px;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .login-form input {
            width: calc(100% - 22px);
            padding: 12px;
            margin: 10px 0;
            border: 1px solid black;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        .login-form input:focus {
            border-color: #ff7e5f;
            outline: none;
        }
        .login-form button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, red, bllue);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
        }
        .login-form button:hover {
            background: linear-gradient(90deg, orange, green);
            transform: scale(1.05);
        }

    transition: background 0.3s ease, transform 0.3s ease;
}

#m-div button:hover {
    background: linear-gradient(90deg, blue, red);
    transform: scale(1.05);
